<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Reward Calendar Demo</title>
  <style>
    :root{--coral:#ff7a5c;--pink:#ff7daf;--purple:#a378e6;--ink:#241f33;--card:rgba(255,255,255,.9)}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:linear-gradient(145deg,#fff3f3,#f4f3ff 55%,#f2fffb);min-height:100vh}.app{min-height:100vh;padding:54px 16px 110px}.title{text-align:center;font-size:18px;font-weight:800;margin:0 0 22px}.screen{display:none;animation:enter .25s ease}.screen.active{display:block}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}h1{font-size:26px;margin:0}.section-head{display:flex;align-items:center;gap:9px;margin:0 0 12px}.add{border:0;width:34px;height:34px;border-radius:50%;color:white;background:var(--coral);font-size:26px;line-height:1}.hint{margin-left:auto;color:var(--pink);font-size:13px;font-weight:700}.goal{width:100%;border:1px solid rgba(255,122,92,.28);background:var(--card);border-radius:20px;padding:13px;display:flex;align-items:center;gap:12px;text-align:left;color:inherit}.goal.done{background:rgba(255,122,92,.10)}.goal-icon{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:rgba(255,122,92,.15);font-size:24px}.goal strong{font-size:17px}.goal small{display:block;color:#777;margin-top:3px}.goal .heart{margin-left:auto;color:var(--pink);font-size:23px}.card{background:var(--card);border:1px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:0 10px 25px rgba(163,120,230,.08);padding:16px;margin-top:16px}.month-head{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:21px}.month-head button{border:0;background:rgba(255,122,92,.14);color:var(--coral);width:42px;height:42px;border-radius:50%;font-size:24px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:4px}.week{color:#888;font-size:12px;font-weight:700;margin:15px 0 5px}.day{height:40px;border:0;background:transparent;border-radius:10px;position:relative}.day.today{background:rgba(255,122,92,.14);font-weight:800}.day.stamped:after{content:'♥';position:absolute;inset:4px;display:grid;place-items:center;color:#f34d83;font-size:28px;opacity:.85}.day.stamped span{position:relative;z-index:1}.summary{display:flex;align-items:center}.flame{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:#ffe8d4;font-size:28px}.summary div:nth-child(2){margin-left:12px}.summary small{color:#888}.summary strong{display:block;font-size:25px}.summary em{margin-left:auto;color:var(--pink);font-style:normal;font-weight:700}.rate-head{display:flex;align-items:center;font-weight:800;font-size:18px}.rate-head b{margin-left:auto;color:var(--purple);font-size:28px}.bar{height:14px;background:rgba(163,120,230,.14);border-radius:10px;overflow:hidden;margin:12px 0}.bar i{display:block;width:40%;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple));border-radius:inherit}.stamps{display:flex;justify-content:space-around}.stamp{width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,125,175,.35);display:grid;place-items:center;font-size:27px}.reward-row{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid #eee}.reward-row:last-child{border:0}.reward-row button,.shop-use{margin-left:auto;border:0;border-radius:18px;background:var(--coral);color:white;font-weight:800;padding:10px 14px}.reward-row button:disabled{background:#ddd}.shop-title{font-size:26px;margin:0 0 12px}.points{display:flex;align-items:center;gap:14px}.points i{width:54px;height:54px;display:grid;place-items:center;border-radius:50%;background:#ffe7df;font-style:normal;font-size:28px}.points strong{font-size:30px}.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.shop-item{text-align:center;padding:18px 8px}.shop-item .symbol{height:88px;display:grid;place-items:center;font-size:60px}.shop-item h3{margin:4px}.shop-use{margin:6px auto 0}.notice{position:fixed;top:80px;left:50%;transform:translate(-50%,-20px);background:#241f33;color:#fff;padding:10px 16px;border-radius:20px;font-weight:700;opacity:0;transition:.25s;z-index:5}.notice.show{opacity:1;transform:translate(-50%,0)}.tabbar{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));height:76px;border:1px solid rgba(255,255,255,.9);border-radius:28px;background:rgba(255,255,255,.86);backdrop-filter:blur(20px);display:grid;grid-template-columns:repeat(4,1fr);padding:7px}.tabbar button{border:0;background:transparent;border-radius:22px;color:#24242a;font-size:10px;font-weight:700}.tabbar button b{display:block;font-size:24px;line-height:28px}.tabbar button.active{background:rgba(255,122,92,.12);color:var(--coral)}.placeholder{text-align:center;padding:70px 20px;color:#777}@media(max-width:360px){.app{padding-left:12px;padding-right:12px}.card{padding:13px}.tabbar{left:6px;right:6px}}
  </style>
</head>
<body>
<main class="app">
  <p class="title">Reward Calendar</p>
  <section class="screen active" data-screen="calendar">
    <div class="section-head"><h1>今日の目標</h1><button class="add" aria-label="目標を追加">＋</button><span class="hint">できたらタップ！</span></div>
    <button class="goal" id="goal"><span class="goal-icon">✓</span><span><strong>自炊する！</strong><small>達成スタンプを押す</small></span><span class="heart">›</span></button>
    <article class="card"><div class="month-head"><button>‹</button><span>2026年 11月</span><button>›</button></div><div class="week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div class="days" id="days"></div></article>
    <article class="card summary"><span class="flame">🔥</span><div><small>連続達成</small><strong id="streak">2日</strong></div><em>今日も一歩ずつ ♪</em></article>
    <article class="card"><div class="rate-head"><span>▮▮▮ 月間達成率</span><b id="rate">40%</b></div><div class="bar"><i id="rateBar"></i></div></article>
    <article class="card"><div class="rate-head"><span>スタンプカード</span><b style="font-size:16px;color:var(--coral)" id="remaining">残り 5 pt</b></div><div class="stamps" id="stampRow"><span class="stamp">♥</span><span class="stamp">♥</span><span class="stamp"></span></div></article>
    <article class="card"><div class="section-head"><h2 style="font-size:20px;margin:0">自分へのご褒美</h2></div><div class="reward-row"><span>🎁</span><div><strong>たまには外食！</strong><small style="display:block;color:#888">3 pt</small></div><button id="redeem">交換</button></div></article>
  </section>
  <section class="screen" data-screen="photos"><div class="placeholder"><div style="font-size:64px">📷</div><h1>フォトログ</h1><p>達成した日の写真を残せます。</p></div></section>
  <section class="screen" data-screen="shop"><h1 class="shop-title">ご褒美ショップ</h1><article class="card points"><i>✨</i><div><small>使えるポイント</small><strong id="points">5 pt</strong></div></article><h2>5pt スタンプ</h2><div class="shop-grid"><article class="card shop-item"><div class="symbol">🐱</div><h3>猫</h3><button class="shop-use">使う</button></article><article class="card shop-item"><div class="symbol">🛸</div><h3>UFO</h3><button class="shop-use">使う</button></article><article class="card shop-item"><div class="symbol">💗</div><h3>ハート</h3><button class="shop-use">使う</button></article><article class="card shop-item"><div class="symbol">⭐</div><h3>星</h3><button class="shop-use">使う</button></article></div></section>
  <section class="screen" data-screen="settings"><div class="placeholder"><div style="font-size:64px">⚙️</div><h1>設定</h1><p>テーマや通知を設定できます。</p></div></section>
</main>
<div class="notice" id="notice">達成できたよ！ ＋1 pt</div>
<nav class="tabbar"><button class="active" data-tab="calendar"><b>▦</b>Reward Calendar</button><button data-tab="photos"><b>▣</b>フォトログ</button><button data-tab="shop"><b>▰</b>ショップ</button><button data-tab="settings"><b>⚙</b>設定</button></nav>
<script>
  const days=document.querySelector('#days');for(let i=0;i<7;i++)days.append(document.createElement('span'));for(let i=1;i<=30;i++){const b=document.createElement('button');b.className='day'+(i===3?' today':'')+([1,2].includes(i)?' stamped':'');b.innerHTML='<span>'+i+'</span>';b.onclick=()=>b.classList.toggle('stamped');days.append(b)}
  let done=false,points=5;const goal=document.querySelector('#goal'),notice=document.querySelector('#notice');goal.onclick=()=>{done=!done;goal.classList.toggle('done',done);goal.querySelector('small').textContent=done?'達成できたよ！':'達成スタンプを押す';goal.querySelector('.heart').textContent=done?'♥':'›';if(done){points++;document.querySelector('#streak').textContent='3日';document.querySelector('#rate').textContent='45%';document.querySelector('#rateBar').style.width='45%';notice.classList.add('show');setTimeout(()=>notice.classList.remove('show'),1400)}else points--;syncPoints()};function syncPoints(){document.querySelector('#points').textContent=points+' pt';document.querySelector('#remaining').textContent='残り '+points+' pt';document.querySelector('#redeem').disabled=points<3}syncPoints();
  document.querySelector('#redeem').onclick=()=>{if(points<3)return;points-=3;syncPoints();notice.textContent='ご褒美と交換しました！';notice.classList.add('show');setTimeout(()=>notice.classList.remove('show'),1400)};document.querySelectorAll('.shop-use').forEach(b=>b.onclick=()=>{notice.textContent=b.parentElement.querySelector('h3').textContent+'を選びました';notice.classList.add('show');setTimeout(()=>notice.classList.remove('show'),1200)});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.dataset.screen===b.dataset.tab));window.scrollTo({top:0,behavior:'smooth'})});
</script>
</body></html>
