<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>まつたけと、とろろと、ねこ手帳</title>
  <meta name="description" content="まつたけ、とろろ、猫の生活記録アプリ『ねこ手帳』の紹介。">
  <meta property="og:title" content="まつたけと、とろろと、ねこ手帳">
  <meta property="og:description" content="まつたけ、とろろ、猫の生活記録アプリ『ねこ手帳』の紹介。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://matsutakepon.github.io/assets/og-v2.png">
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav shell">
    <nav aria-label="メインナビゲーション">
      <a href="#cats">まつたけ・とろろ</a>
      <a href="#work">ねこ手帳</a>
    </nav>
    <a class="github-head" href="https://github.com/Matsutakepon" target="_blank" rel="noreferrer">GitHub</a>
  </header>

  <main>
    <section class="hero-art" id="top">
      <img src="assets/cats-watercolor-hero-v2.png" alt="窓辺でのんびり過ごす、とろろとまつたけの水彩画">
    </section>

    <section class="cats shell" id="cats">
      <div class="section-head"><h1>まつたけととろろ</h1></div>
      <div class="cat-grid">
        <article class="cat-card">
          <div class="cat-portrait"><img src="assets/matsutake-sketch.png" alt="まつたけのスケッチ画"></div>
          <div class="cat-info">
            <h2>まつたけ</h2>
            <p>毎朝4時ごろに起こしにくる、優しい性格。</p>
          </div>
        </article>
        <article class="cat-card">
          <div class="cat-portrait"><img src="assets/tororo-sketch-v2.png" alt="とろろのスケッチ画"></div>
          <div class="cat-info">
            <h2>とろろ</h2>
            <p>作業中にキーボードの上に座りに来るくらい甘えん坊。</p>
          </div>
        </article>
      </div>
    </section>

    <section class="work" id="work">
      <div class="shell">
        <div class="section-head light"><h1>ねこ手帳</h1></div>
        <article class="project-card">
          <div class="app-visual">
            <img class="screen screen-back" src="assets/neko-techo-timer.png" alt="ねこ手帳の遊びタイマー画面">
            <img class="screen screen-front" src="assets/neko-techo-home.png" alt="ねこ手帳のホーム画面">
          </div>
          <div class="project-copy">
            <h2>ねこ手帳</h2>
            <p>日々のお世話や体調、遊んだ時間まで。二匹との暮らしで本当に欲しかったものをまとめた猫の生活記録アプリです。</p>
            <ul>
              <li>ごはん・ブラッシングなどのお世話を記録</li>
              <li>遊んだ時間をタイマーで計測</li>
              <li>猫ごとに記録を分けて管理</li>
            </ul>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer>
    <div class="shell">
      <a class="footer-github" href="https://github.com/Matsutakepon" target="_blank" rel="noreferrer">GitHub</a>
      <div class="copyright"><span>© 2026</span><a href="#top">ページ上部へ</a></div>
    </div>
  </footer>
</body>
</html>
